[package]
name = "dmrc-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Delhi Metro route planner with precomputed journeys embedded at build time"
repository = "https://github.com/keogami/dmrc-rs"
keywords = ["delhi", "metro", "dmrc", "transit", "routing"]
categories = ["embedded", "data-structures"]
readme = "README.md"
authors = ["keogami <https://github.com/keogami>"]

[dependencies]
nucleo-matcher = "0.3.1"
rkyv = "0.8.13"

[build-dependencies]
anyhow = "1.0.100"
gtfs-structures = "0.46.1"
rayon = "1.10"
rkyv = "0.8.13"
raptor = "0.1.1"

[dev-dependencies]
humantime = "2.3.0"
